<!DOCTYPE html>
<html>
<head>
    <title>Flask MongoDB Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 400px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            text-align: center;
        }

        label {
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        .error {
            background-color: #ffdddd;
            color: red;
            padding: 10px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Form</h1>

    {% if error %}
        <div class="error">
            Error: {{ error }}
        </div>
    {% endif %}

    <form method="POST">

        <label>Name:</label>
        <input type="text" name="name">

        <label>Email:</label>
        <input type="email" name="email">

        <label>Course:</label>
        <input type="text" name="course">

        <button type="submit">
            Submit Data
        </button>

    </form>

</div>

</body>
</html>
