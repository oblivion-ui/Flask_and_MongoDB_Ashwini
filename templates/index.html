<!DOCTYPE html>
<html>
<head>
    <title>Flask MongoDB To-Do</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 450px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            text-align: center;
        }

        label {
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>To-Do Item</h1>

    <form method="POST" action="/submittodoitem">

        <label>Item Name:</label>
        <input type="text" name="itemName" required>

        <label>Item Description:</label>
        <textarea name="itemDescription" required></textarea>

        <button type="submit">Submit To-Do Item</button>

    </form>

</div>

</body>
</html>
